name: Cppcheck Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cppcheck:
    name: Run Cppcheck
    runs-on: ubuntu-24.04  # You can also use windows-latest or macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run static analysis
        run: |
          cppcheck --version
          cppcheck ./lib/src \
          -I ./lib/include/ \
          --enable=all \
          --suppress=unusedFunction \
          --suppress=missingIncludeSystem \
          --error-exitcode=2 --inline-suppr

      - name: Save cppcheck report
        if: always()
        run: |
          cppcheck --enable=style --inconclusive --xml --xml-version=2 lib/ -I lib/include 2> cppcheck-report.xml
        continue-on-error: true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.xml
