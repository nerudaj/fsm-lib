name: Cppcheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install CppCheck
      run: |
        sudo apt install cppcheck
      shell: bash
    
    - name: Run CppCheck
      run: |
        cppcheck ./lib/src \
        -I ./lib/include/ \
        --enable=all \
        --suppress=unusedFunction \
        --suppress=missingIncludeSystem \
        --error-exitcode=2 --inline-suppr
      shell: bash
